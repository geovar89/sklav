<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Δωρεάν Χάρτης Καταστημάτων</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; color: #222; }
    .app { display: grid; grid-template-columns: 380px 1fr; height: 100%; }
    .sidebar { overflow: hidden; display: flex; flex-direction: column; border-right: 1px solid #ddd; background: #fff; z-index: 1000; }
    .header { padding: 18px; background: #ffd800; }
    .header h1 { margin: 0 0 6px; font-size: 22px; }
    .header p { margin: 0; font-size: 13px; }
    .controls { padding: 14px; border-bottom: 1px solid #ddd; display: grid; gap: 10px; }
    input, select, button { width: 100%; padding: 11px 12px; border: 1px solid #bbb; border-radius: 7px; font-size: 14px; background: white; }
    button { cursor: pointer; background: #222; color: white; border-color: #222; font-weight: 700; }
    button:hover { background: #444; }
    .counter { font-size: 13px; color: #555; }
    .store-list { overflow-y: auto; flex: 1; }
    .store-card { padding: 14px; border-bottom: 1px solid #eee; cursor: pointer; }
    .store-card:hover { background: #fff9d8; }
    .store-card h3 { margin: 0 0 6px; font-size: 16px; }
    .store-card p { margin: 3px 0; font-size: 13px; line-height: 1.4; }
    .badge { display: inline-block; padding: 3px 7px; margin-top: 5px; border-radius: 999px; background: #222; color: white; font-size: 11px; }
    #map { width: 100%; height: 100%; }
    .popup { max-width: 330px; line-height: 1.45; }
    .popup img { width: 100%; max-height: 145px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; }
    .popup h2 { font-size: 18px; margin: 0 0 6px; }
    .popup p { margin: 5px 0; }
    .popup a { color: #075ec7; text-decoration: none; }
    .services { margin-top: 8px; padding-top: 8px; border-top: 1px solid #ddd; }
    .leaflet-popup-content { margin: 13px 16px; }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(255,216,0,.55); }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background-color: #ffd800; color: #111; font-weight: 700; }
    .leaflet-control-attribution { font-size: 10px; }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; grid-template-rows: 44% 56%; }
      .sidebar { border-right: 0; border-bottom: 1px solid #ddd; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="header">
        <h1>Καταστήματα</h1>
        <p>Δωρεάν χάρτης OpenStreetMap με clustering · 492 σημεία</p>
      </div>
      <div class="controls">
        <input id="searchInput" type="search" placeholder="Αναζήτηση ονόματος, περιοχής, διεύθυνσης...">
        <select id="countyFilter"><option value="">Όλοι οι νομοί</option></select>
        <select id="typeFilter"><option value="">Όλοι οι τύποι καταστημάτων</option></select>
        <button id="resetButton" type="button">Επαναφορά φίλτρων</button>
        <div id="counter" class="counter"></div>
      </div>
      <div id="storeList" class="store-list"></div>
    </aside>
    <main id="map"></main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

      const recycling = serviceTitles(store.RecyclingServices);
      const hours = (store.WorkingHours || '').replaceAll('<br/>','<br>').replaceAll('<br />','<br>');
      const directions = store.DirectionsUrl || `https://www.google.com/maps/dir/?api=1&destination=${store.Latitude},${store.Longitude}`;
      return `
        <div class="popup">
          ${store.Image ? `<img src="${escapeHtml(store.Image)}" alt="${escapeHtml(store.Title)}" onerror="this.style.display='none'">` : ''}
          <h2>${escapeHtml(store.Title)}</h2>
          <p><strong>${escapeHtml(getStoreType(store))}</strong></p>
          <p>${escapeHtml(store.Address)}${store.ZipCode ? `, ΤΚ ${escapeHtml(store.ZipCode)}` : ''}</p>
          ${store.County ? `<p><strong>Νομός:</strong> ${escapeHtml(store.County)}</p>` : ''}
          ${store.PhoneNumberText ? `<p><strong>Τηλέφωνο:</strong> ${escapeHtml(store.PhoneNumberText)}</p>` : ''}
          ${store.Email ? `<p><strong>Email:</strong> <a href="mailto:${escapeHtml(store.Email)}">${escapeHtml(store.Email)}</a></p>` : ''}
          ${hours ? `<p><strong>Ωράριο:</strong><br>${hours}</p>` : ''}
          ${store.ParkingSlotsAvailable != null ? `<p><strong>Θέσεις parking:</strong> ${escapeHtml(store.ParkingSlotsAvailable)}</p>` : ''}
          ${services.length ? `<div class="services"><strong>Υπηρεσίες:</strong><br>${services.map(escapeHtml).join(', ')}</div>` : ''}
          ${recycling.length ? `<div class="services"><strong>Ανακύκλωση:</strong><br>${recycling.map(escapeHtml).join(', ')}</div>` : ''}
          <p><a href="${escapeHtml(directions)}" target="_blank" rel="noopener">Οδηγίες μετάβασης</a></p>
        </div>`;
    }

    stores.forEach(store => {
      const marker = L.marker([Number(store.Latitude), Number(store.Longitude)]);
      marker.bindPopup(popupContent(store), { maxWidth: 360 });
      markerEntries.push({ store, marker });
      clusterGroup.addLayer(marker);
    });
    map.addLayer(clusterGroup);

    function populateFilters() {
      const counties = [...new Set(stores.map(x => x.County).filter(Boolean))].sort((a,b) => a.localeCompare(b,'el'));
      const types = [...new Set(stores.map(getStoreType).filter(Boolean))].sort((a,b) => a.localeCompare(b,'el'));
      const countyFilter = document.getElementById('countyFilter');
      const typeFilter = document.getElementById('typeFilter');
      counties.forEach(v => countyFilter.add(new Option(v,v)));
      types.forEach(v => typeFilter.add(new Option(v,v)));
    }

    function renderList(list) {
      const container = document.getElementById('storeList');
      container.innerHTML = '';
      const frag = document.createDocumentFragment();
      list.forEach(store => {
        const card = document.createElement('article');
        card.className = 'store-card';
        card.innerHTML = `<h3>${escapeHtml(store.Title)}</h3><p>${escapeHtml(store.Address)}</p>${store.PhoneNumberText ? `<p>Τηλ.: ${escapeHtml(store.PhoneNumberText)}</p>` : ''}<span class="badge">${escapeHtml(getStoreType(store))}</span>`;
        card.addEventListener('click', () => focusStore(store));
        frag.appendChild(card);
      });
      container.appendChild(frag);
      document.getElementById('counter').textContent = `Εμφανίζονται ${list.length} από ${stores.length} καταστήματα`;
    }

    function focusStore(store) {
      const entry = markerEntries.find(x => String(x.store.Key) === String(store.Key));
      if (!entry) return;
      clusterGroup.zoomToShowLayer(entry.marker, () => {
        map.setView(entry.marker.getLatLng(), 17);
        entry.marker.openPopup();
      });
    }

    function applyFilters() {
      const term = document.getElementById('searchInput').value.trim().toLocaleLowerCase('el');
      const county = document.getElementById('countyFilter').value;
      const type = document.getElementById('typeFilter').value;
      visibleStores = stores.filter(store => {
        const haystack = [store.Title, store.Address, store.Area, store.County, store.ZipCode, store.PhoneNumberText, store.Email].join(' ').toLocaleLowerCase('el');
        return (!term || haystack.includes(term)) && (!county || store.County === county) && (!type || getStoreType(store) === type);
      });
      const keys = new Set(visibleStores.map(x => String(x.Key)));
      clusterGroup.clearLayers();
      markerEntries.filter(x => keys.has(String(x.store.Key))).forEach(x => clusterGroup.addLayer(x.marker));
      renderList(visibleStores);
      if (visibleStores.length) {
        const bounds = clusterGroup.getBounds();
        if (bounds.isValid()) map.fitBounds(bounds, { padding: [30,30], maxZoom: 15 });
      }
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('countyFilter').addEventListener('change', applyFilters);
    document.getElementById('typeFilter').addEventListener('change', applyFilters);
    document.getElementById('resetButton').addEventListener('click', () => {
      document.getElementById('searchInput').value = '';
      document.getElementById('countyFilter').value = '';
      document.getElementById('typeFilter').value = '';
      applyFilters();
    });

    populateFilters();
    renderList(stores);
    const allBounds = clusterGroup.getBounds();
    if (allBounds.isValid()) map.fitBounds(allBounds, { padding: [20,20] });
  </script>
</body>
</html>
